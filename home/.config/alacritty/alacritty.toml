[window]
padding.x = 3
padding.y = 2

[env]
TERM = "alacritty"

[font]
size = 11.7
#offset.x = -1
offset.y = 1

[font.normal]
family = "Rec Mono SemiCasual"
style = "Regular"

[font.bold]
family = "Rec Mono SemiCasual"
style = "Bold"

[font.italic]
family = "Rec Mono SemiCasual"
style = "Italic"

[font.bold_italic]
family = "Rec Mono SemiCasual"
style = "Bold Italic"

# Default colors
[colors.primary]
background = '#000000'
foreground = '#dddddd'

# Cursor colors
[colors.cursor]
text   = '#111111'
cursor = '#cccccc'

# Normal colors
[colors.normal]
black   = '#000000'
red     = '#cc0403'
green   = '#19cb00'
yellow  = '#cecb00'
blue    = '#0d73cc'
magenta = '#cb1ed1'
cyan    = '#0dcdcd'
white   = '#dddddd'

# Bright colors
[colors.bright]
black   = '#767676'
red     = '#f2201f'
green   = '#23fd00'
yellow  = '#fffd00'
blue    = '#1a8fff'
magenta = '#fd28ff'
cyan    = '#14ffff'
white   = '#ffffff'
