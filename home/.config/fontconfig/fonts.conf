<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <!-- User fonts -->
    <dir>~/.local/share/fonts</dir>


    <!-- =========================
        Generic font families
    ========================= -->

    <!-- Sans-serif -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Roboto</family>
            <family>Noto Sans Bengali</family>
            <family>Noto Naskh Arabic</family>
        </prefer>
    </alias>

    <!-- Serif -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>Roboto Slab</family>
            <family>Noto Serif Bengali</family>
            <family>Noto Naskh Arabic</family>
        </prefer>
    </alias>

    <!-- Monospace -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>Rec Mono Semicasual</family>
            <family>Noto Sans Bengali</family>
            <family>Noto Naskh Arabic</family>
        </prefer>
    </alias>


    <!-- =========================
        Emoji
    ========================= -->

    <alias>
        <family>emoji</family>
        <prefer>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>


    <!-- =========================
        Font rendering
    ========================= -->

    <!-- Greyscale antialiasing -->
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
    </match>

    <!-- Enable gentle hinting -->
    <match target="font">
        <edit name="hinting" mode="assign">
            <bool>true</bool>
        </edit>
    </match>

    <match target="font">
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
    </match>

    <!-- Greyscale subpixel rendering -->
    <match target="font">
        <edit name="rgba" mode="assign">
            <const>none</const>
        </edit>
    </match>

</fontconfig>
