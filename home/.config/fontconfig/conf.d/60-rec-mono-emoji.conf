<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <!-- Make Noto Color Emoji available when applications
    request Rec Mono Semicasual / monospace. -->
    <match target="pattern">
        <test name="family" compare="eq">
            <string>Rec Mono Semicasual</string>
        </test>

        <edit name="family" mode="append" binding="strong">
            <string>Noto Color Emoji</string>
        </edit>
    </match>

</fontconfig>
